        <main class="main-agenda">
            <aside class="dias-semana">
                <div class="container-tabela">
                    <div class="dia" data-dia-offset="0">
                        <h4 class="titulo-dia-semana">Segunda-feira</h4>
                        <div class="observacoes" contenteditable="true" data-index="obs"></div>
                    </div>
                    <div class="dia" data-dia-offset="1">
                        <h4 class="titulo-dia-semana">Terça-feira</h4>
                        <div class="observacoes" contenteditable="true" data-index="obs"></div>
                    </div>
                    <div class="dia" data-dia-offset="2">

                    </div>

                        <th class="coluna-calendario">S</th>
                        <th class="coluna-calendario">S</th>
