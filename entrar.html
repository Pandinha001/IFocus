<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <title>| IFocus |</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="pag_principal">
            <!-- MENU -->

            <nav class="menu">

                <a href="entrar.html" class="index">
                    Entrar
                </a>

                <a href="inicio.html">
                    Início
                </a>
                <button id="botao-tema"> Modo noturno</button>

            </nav>
            <!-- LOGIN -->

            <main class="login">
            
                <img class="logo" src="imagens/img.png" alt="a"> 
               
                <div class="formulario">

                    <h2>
                        Bem-vindo de volta
                    </h2>

                    <p class="subtitulo">
                        Entre com sua conta para continuar estudando.
                    </p>
                    <div class="campo">
                        <label>
                            E-mail
                        </label>
                        <input
                            type="email"
                            placeholder="email@gmail.com"
                        >
                    </div>
                    <div class="campo">
                        <label>
                            Senha
                        </label>
                        <input
                            type="password"
                            placeholder="senha"
                        >
                    </div>

                    <a
                        href="inicio.html"
                        class="botao_login"
                    >
                        Entrar
                    </a>

                    <div class="trocar_conta">
                        <a href="cadastro.html">
                            Criar conta
                        </a>
                    </div>
                </div>
            </main>
        </div>
        <script src="java/modo.js"></script>
    </body>
</html>
